<ng-content select="[aevkoDialogTrigger]" />
<dialog
  #panel
  data-slot="dialog-content"
  [attr.role]="dialogRole()"
  aria-modal="true"
  [attr.aria-label]="title()"
  [attr.aria-description]="description() || null"
  [attr.data-side]="side()"
  (click)="handleBackdrop($event)"
  (cancel)="handleCancel($event)"
  (close)="handleClose()"
>
  <header data-slot="dialog-header">
    <div>
      <h2 data-slot="dialog-title">{{ title() }}</h2>
      @if (description()) {
        <p data-slot="dialog-description">{{ description() }}</p>
      }
    </div>
    @if (showCloseButton()) {
      <button
        type="button"
        class="close"
        data-slot="dialog-close"
        aria-label="Close dialog"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    }
  </header>
  <div class="content" data-slot="dialog-body"><ng-content /></div>
</dialog>
