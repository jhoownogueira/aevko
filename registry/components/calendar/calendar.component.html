<div class="header">
  <button type="button" aria-label="Previous month" (click)="changeMonth(-1)">‹</button
  ><strong aria-live="polite">{{ monthLabel() }}</strong
  ><button type="button" aria-label="Next month" (click)="changeMonth(1)">›</button>
</div>
<div role="grid" [attr.aria-label]="label()">
  <div role="row" class="weekdays">
    @for (weekday of weekdays; track weekday) {
      <span role="columnheader" [attr.aria-label]="weekday">{{ weekday.slice(0, 2) }}</span>
    }
  </div>
  @for (week of [0, 1, 2, 3, 4, 5]; track week) {
    <div role="row">
      @for (day of days().slice(week * 7, week * 7 + 7); track day.date) {
        <button
          type="button"
          role="gridcell"
          [attr.data-aevko-date]="day.date"
          [attr.data-outside]="day.outside"
          [attr.aria-selected]="value() === day.date"
          [disabled]="disabled(day.date)"
          [tabindex]="value() === day.date || (!value() && day.day === 1 && !day.outside) ? 0 : -1"
          (click)="select(day.date)"
          (keydown)="move($event, day.date)"
        >
          {{ day.day }}
        </button>
      }
    </div>
  }
</div>
