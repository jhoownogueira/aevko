<div
  class="viewport"
  [attr.data-orientation]="orientation()"
  (pointerdown)="pointerDown($event)"
  (pointerup)="pointerUp($event)"
>
  <ng-content />
</div>
<div class="controls">
  <button
    type="button"
    aria-label="Previous slide"
    [disabled]="!loop() && index() === 0"
    (click)="previous()"
  >
    <span class="control-icon" aria-hidden="true">
      <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="m15 18-6-6 6-6" />
      </svg>
      <ng-content select="[aevkoCarouselPreviousIcon]" />
    </span></button
  ><span aria-live="polite">{{ index() + 1 }} / {{ slides().length }}</span
  ><button
    type="button"
    aria-label="Next slide"
    [disabled]="!loop() && index() >= slides().length - 1"
    (click)="next()"
  >
    <span class="control-icon" aria-hidden="true">
      <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="m9 18 6-6-6-6" />
      </svg>
      <ng-content select="[aevkoCarouselNextIcon]" />
    </span>
  </button>
</div>
