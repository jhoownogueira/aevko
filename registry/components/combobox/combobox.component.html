<input
  type="text"
  data-slot="combobox-input"
  role="combobox"
  aria-autocomplete="list"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="id() + '-list'"
  [attr.aria-activedescendant]="
    open() && activeOption() ? id() + '-option-' + activeOption()!.value : null
  "
  [placeholder]="placeholder()"
  [value]="query()"
  [disabled]="isDisabled()"
  (blur)="touch()"
  (focus)="!isDisabled() && open.set(true)"
  (input)="inputValue($any($event.target).value)"
  (keydown)="keydown($event)"
/>
<div
  [id]="id() + '-list'"
  data-slot="combobox-content"
  aevkoFloating
  role="listbox"
  [attr.aria-label]="label()"
  [hidden]="!open()"
>
  @for (item of filtered(); track item.value; let index = $index) {
    <div
      role="option"
      data-slot="combobox-item"
      [id]="id() + '-option-' + item.value"
      [attr.aria-selected]="value() === item.value"
      [attr.aria-disabled]="item.disabled || null"
      [attr.data-active]="activeOption()?.value === item.value"
      (click)="choose(item)"
    >
      {{ item.label }}
    </div>
  }
  @if (!filtered().length) {
    <p>{{ emptyMessage() }}</p>
  }
</div>
