<section class="auth-shell compact" data-slot="signup-04-block">
  <div class="auth-panel">
    <div class="auth-card">
      <p class="auth-brand">Aevko.</p>
      <h1>Create account</h1>
      <p class="auth-intro">Use your work email to begin.</p>
      <form (submit)="submit($event)">
        <div class="auth-field">
          <label aevkoLabel for="signup-04-name">Name</label
          ><input aevkoInput id="signup-04-name" name="name" autocomplete="name" required />
        </div>
        <div class="auth-field">
          <label aevkoLabel for="signup-04-email">Email</label
          ><input
            aevkoInput
            id="signup-04-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
        <div class="auth-field">
          <label aevkoLabel for="signup-04-password">Password</label
          ><input
            aevkoInput
            id="signup-04-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>
        <label class="auth-check"
          ><input aevkoCheckbox type="checkbox" required /> <span>I agree to the terms</span></label
        >
        <button aevkoButton type="submit">Create account</button>
      </form>
      <p role="status">{{ status() }}</p>
      <p class="auth-meta">Form preview. Authentication is not connected.</p>
      @if (alternateUrl()) {
        <p class="auth-meta">Already have an account? <a [href]="alternateUrl()">Sign in</a></p>
      }
    </div>
  </div>
</section>
