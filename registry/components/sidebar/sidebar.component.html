<button
  class="mobile-trigger"
  type="button"
  [attr.aria-expanded]="open()"
  aria-controls="aevko-sidebar-panel"
  (click)="open.update((value) => !value)"
>
  <span class="control-icon" aria-hidden="true">
    <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    <ng-content select="[aevkoSidebarMenuIcon]" />
  </span>
  <span>Menu</span>
</button>
@if (open()) {
  <button class="backdrop" type="button" aria-label="Close navigation" (click)="close()"></button>
}
<aside
  id="aevko-sidebar-panel"
  [class.open]="open()"
  [class.collapsed]="collapsed()"
  [attr.aria-label]="label()"
>
  <div class="header">
    <ng-content select="[aevkoSidebarHeader]" /><button
      class="collapse"
      type="button"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
      (click)="collapsed.update((value) => !value)"
    >
      @if (collapsed()) {
        <span class="control-icon" aria-hidden="true">
          <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m9 18 6-6-6-6" />
          </svg>
          <ng-content select="[aevkoSidebarExpandIcon]" />
        </span>
      } @else {
        <span class="control-icon" aria-hidden="true">
          <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m15 18-6-6 6-6" />
          </svg>
          <ng-content select="[aevkoSidebarCollapseIcon]" />
        </span>
      }
    </button>
  </div>
  <nav [attr.aria-label]="label()" (click)="closeOnNavigate() && close()"><ng-content /></nav>
  <div class="footer"><ng-content select="[aevkoSidebarFooter]" /></div>
</aside>
