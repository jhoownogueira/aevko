<div class="search" data-slot="command-input-wrapper">
  <input
    type="search"
    data-slot="command-input"
    [attr.aria-label]="label()"
    [attr.aria-controls]="id() + '-list'"
    [attr.aria-activedescendant]="activeOption() ? id() + '-item-' + activeOption()!.id : null"
    aria-autocomplete="list"
    [placeholder]="placeholder()"
    [value]="query()"
    [disabled]="disabled()"
    (input)="query.set($any($event.target).value); active.set(0)"
    (keydown)="move($event)"
  />
</div>
<div
  [id]="id() + '-list'"
  data-slot="command-list"
  [attr.role]="filtered().length ? 'listbox' : null"
  [attr.aria-label]="filtered().length ? label() : null"
>
  @for (item of filtered(); track item.id; let index = $index) {
    <div
      role="option"
      data-slot="command-item"
      [id]="id() + '-item-' + item.id"
      [attr.aria-selected]="value() === item.id"
      [attr.aria-disabled]="item.disabled || null"
      [attr.tabindex]="item.disabled ? -1 : 0"
      [attr.data-active]="activeOption()?.id === item.id"
      (click)="select(item)"
      (keydown.enter)="select(item)"
    >
      <span
        ><strong>{{ item.label }}</strong>
        @if (item.description) {
          <small>{{ item.description }}</small>
        }
      </span>
      @if (item.shortcut) {
        <kbd>{{ item.shortcut }}</kbd>
      }
    </div>
  }
  @if (!filtered().length) {
    <p data-slot="command-empty" role="status">No commands found.</p>
  }
</div>
