<input
  data-slot="input-otp-control"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-label]="label()"
  [attr.maxlength]="maxLength()"
  [disabled]="isDisabled()"
  [value]="value()"
  autocomplete="one-time-code"
  inputmode="numeric"
  type="text"
  (blur)="touch()"
  (input)="update($event)"
/>
<div class="slots" data-slot="input-otp-group" aria-hidden="true">
  @for (character of slots(); track $index) {
    <span
      data-slot="input-otp-slot"
      [attr.data-active]="$index === value().length ? 'true' : null"
      >{{ character }}</span
    >
  }
</div>
