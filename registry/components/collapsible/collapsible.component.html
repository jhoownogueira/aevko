<button
  type="button"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="panelId()"
  (click)="toggle()"
>
  <span>{{ label() }}</span
  ><span class="indicator" [class.open]="open()" aria-hidden="true">
    <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="m9 18 6-6-6-6" />
    </svg>
    <ng-content select="[aevkoCollapsibleIcon]" />
  </span>
</button>
<div
  class="panel"
  [id]="panelId()"
  [attr.data-state]="open() ? 'open' : 'closed'"
  [attr.aria-hidden]="!open()"
  [inert]="!open()"
>
  <div class="content-clip">
    <div class="content"><ng-content /></div>
  </div>
</div>
