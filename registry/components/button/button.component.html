@if (loading()) {
  <span class="aevko-button__spinner" data-slot="button-spinner" aria-hidden="true"></span>
}
<span class="aevko-button__icon" data-slot="button-icon-start" aria-hidden="true">
  <ng-content select="[aevkoButtonIconStart]" />
</span>
<span class="aevko-button__content" data-slot="button-content"><ng-content /></span>
<span class="aevko-button__icon" data-slot="button-icon-end" aria-hidden="true">
  <ng-content select="[aevkoButtonIconEnd]" />
</span>
