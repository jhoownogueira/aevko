<section data-slot="questionnaire-content" [attr.aria-label]="label()">
  @if (current(); as item) {
    <p class="progress" data-slot="questionnaire-progress">
      Question {{ active() + 1 }} of {{ enabled().length }}
    </p>
    <fieldset data-slot="questionnaire-fieldset" [disabled]="isDisabled()">
      <legend>{{ item.prompt }}</legend>
      @if (item.description) {
        <p>{{ item.description }}</p>
      }
      <div class="choices">
        @for (choice of item.choices ?? []; track choice.value) {
          <label data-slot="questionnaire-choice"
            ><input
              [type]="item.multiple ? 'checkbox' : 'radio'"
              [name]="item.name"
              [value]="choice.value"
              [checked]="selected(choice.value)"
              (change)="choose(choice.value)"
            /><span
              ><strong>{{ choice.label }}</strong>
              @if (choice.description) {
                <small>{{ choice.description }}</small>
              }
            </span>
            @if (choice.shortcut) {
              <kbd>{{ choice.shortcut }}</kbd>
            }
          </label>
        }
        @if (item.freeform) {
          <label class="freeform"
            ><span>Other answer</span
            ><input
              type="text"
              [name]="item.name + '-other'"
              [value]="answerText(item.name)"
              (input)="freeform($any($event.target).value)"
          /></label>
        }
      </div>
      @if (error()) {
        <p class="error" data-slot="questionnaire-error" role="alert">{{ error() }}</p>
      }
    </fieldset>
    <div class="actions" data-slot="questionnaire-actions">
      <button type="button" [disabled]="isDisabled() || active() === 0" (click)="previous()">
        Previous
      </button>
      @if (item.skippable) {
        <button type="button" [disabled]="isDisabled()" (click)="skip()">Skip</button>
      }
      <button type="button" [disabled]="isDisabled()" (click)="next()">
        {{ last() ? 'Submit' : 'Next' }}
      </button>
    </div>
  }
</section>
